apply plugin: 'com.android.application'

android {
    namespace 'com.googlecode.luaforandroid'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.googlecode.luaforandroid"
        minSdkVersion 21
        targetSdkVersion 33
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}

dependencies {
    implementation project(':InterpreterForAndroid')
    implementation project(':Utils')
}
